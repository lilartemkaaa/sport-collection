name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cards_user
          POSTGRES_PASSWORD: cards_pass
          POSTGRES_DB: cards_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cards_user -d cards_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cards_user:cards_pass@localhost:5432/cards_db
      SECRET_KEY: ci_test_secret_key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app || true
        continue-on-error: true

      - name: Run migrations on PostgreSQL
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing

